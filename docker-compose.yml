# Sobe TUDO do zero com um comando (na raiz do repositório):
#
#     docker compose up -d --build
#
# Na primeira vez, o serviço "setup" cria o .env com senhas e chaves aleatórias,
# o Postgres e o InfluxDB nascem já configurados e o backend cria as tabelas.
#
# Economia de recursos:
#  - backend em Go numa imagem FROM scratch (~10 MB); bancos em Alpine;
#  - limite de memória por container (mem_limit) + caches/pools reduzidos;
#  - logs do Docker limitados a 2 arquivos de 5 MB por container;
#  - portas só em 127.0.0.1 (nada fica exposto para a rede).

x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"

services:
  # ---------------------------------------------------------------------------
  # Roda uma vez a cada "up" e termina: cria/completa o .env da raiz e copia a
  # configuração para o volume "config", lido pelos outros containers.
  # Nunca sobrescreve uma senha ou chave que já exista no .env.
  setup:
    build: ./backend-go
    image: projeto-integrador-backend-go
    # root (UID 0): precisa escrever no volume; depois devolve o .env ao seu usuário.
    # Na imagem FROM scratch não existe /etc/passwd, então o usuário vai por número, não por nome.
    user: "0:0"
    command: ["setup"]               # mesmo binário do backend, no modo "setup"
    environment:
      REPO_DIR: /repo
      CONFIG_DIR: /config
    volumes:
      - .:/repo
      - config:/config
    restart: "no"
    <<: *logs

  # ---------------------------------------------------------------------------
  # PostgreSQL: usuários, comandos e logs
  db:
    image: postgres:16-alpine
    container_name: pi_postgres
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: pi_user
      POSTGRES_DB: projeto_integrador
      POSTGRES_PASSWORD_FILE: /config/db_password   # senha gerada pelo setup
    # Configuração enxuta: o projeto tem poucas conexões e pouco dado relacional
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=64MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_connections=20
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"   # 5433 no computador: evita conflito com Postgres instalado
    volumes:
      - pgdata:/var/lib/postgresql/data
      - config:/config:ro
    mem_limit: 160m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pi_user -d projeto_integrador"]
      interval: 3s
      timeout: 3s
      retries: 20
    <<: *logs

  # ---------------------------------------------------------------------------
  # InfluxDB 3 Core: séries temporais da planta
  influxdb:
    image: influxdb:3-core   # versão fixada: a tag "latest" pode mudar de versão sozinha
    container_name: pi_influxdb
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      # Token de admin gerado pelo setup (só é usado se o banco ainda não tiver tokens)
      - --admin-token-file=/config/influx-admin-token.json
      # O InfluxDB só confirma uma escrita depois de gravá-la no WAL, e grava o WAL em
      # intervalos fixos (padrão 1 s). Com 1 s o RTT medido era ~825 ms; com 100 ms, ~81 ms.
      - --wal-flush-interval=100ms
      # Memória: os padrões são porcentagens da RAM do computador inteiro (20%–50%),
      # muito acima do necessário para ~10 pontos/s. Valores fixos e pequenos:
      - --exec-mem-pool-size=128mb       # memória para consultas
      - --force-snapshot-mem-size=64mb   # buffer antes de gravar em Parquet
      - --disable-file-cache             # sem cache de arquivos em RAM (dados pequenos)
      # Disco: guarda menos arquivos antigos de WAL (padrão 300)
      - --snapshotted-wal-files-to-keep=50
      # Só avisos e erros no log (o padrão "info" escreve uma linha a cada 100 ms)
      - --log-filter=warn
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - influxdata:/var/lib/influxdb3
      - config:/config:ro
    mem_limit: 320m
    <<: *logs

  # ---------------------------------------------------------------------------
  # Backend em Go (API). Imagem FROM scratch (~10 MB). Cria as tabelas do Postgres ao iniciar.
  backend:
    build: ./backend-go
    image: projeto-integrador-backend-go
    container_name: pi_backend
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      influxdb:
        condition: service_started
    # Dentro da rede do Docker os bancos têm outros endereços. Estas variáveis
    # têm prioridade sobre as do .env (o backend não sobrescreve variáveis já definidas).
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      INFLUX_URL: http://influxdb:8181
      HOST: 0.0.0.0
      GOMEMLIMIT: 40MiB      # o coletor de lixo do Go trabalha para ficar abaixo disto
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - config:/config:ro
    mem_limit: 64m
    <<: *logs

volumes:
  pgdata:
  influxdata:
  config:      # .env dos containers, senha do Postgres e token do InfluxDB
